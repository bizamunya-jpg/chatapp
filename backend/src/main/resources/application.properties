spring.application.name=backend
spring.config.import=optional:file:./.env[.properties],optional:file:./database.properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=PT3H
app.jwt.refresh-token-ttl=P30D
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*}
app.files.storage-root=${FILE_STORAGE_ROOT:./private-uploads}
app.files.max-size-bytes=${FILE_MAX_SIZE_BYTES:10485760}
app.files.allowed-content-types=image/jpeg,image/png,image/gif,image/webp,application/pdf,text/plain
app.files.r2.enabled=${R2_ENABLED:false}
app.files.r2.endpoint=${R2_ENDPOINT:}
app.files.r2.bucket=${R2_BUCKET:}
app.files.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.files.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
spring.servlet.multipart.max-file-size=${FILE_MAX_SIZE:10MB}
spring.servlet.multipart.max-request-size=${FILE_MAX_REQUEST_SIZE:11MB}
